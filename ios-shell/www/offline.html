<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitYear</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 32px calc(24px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background: #0B0B0A; color: #F5F5F3; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  .mark { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
          letter-spacing: .2em; text-transform: uppercase; color: #E5FF00; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  p  { margin: 0; max-width: 22rem; font-size: 15px; line-height: 1.5; color: #A3A3A0; }
  button {
    margin-top: 10px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
    background: #E5FF00; color: #0B0B0A; font-size: 16px; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  button:active { opacity: .85; }
</style>
</head>
<body>
  <span class="mark">FitYear</span>
  <h1>You&rsquo;re offline</h1>
  <!-- Says the true and reassuring thing: the local safety net in WorkoutContext
       keeps an in-progress workout in localStorage, so nothing is lost here. -->
  <p>Your workout is saved on this phone. Reconnect and it will sync.</p>
  <button type="button" onclick="location.replace('https://fityear.flyhi.ai/')">Try again</button>
</body>
</html>
